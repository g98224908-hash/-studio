<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استودیو ساخت سایت با هوش مصنوعی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono&display=swap">
<style>
:root{--bg:#06060F;--g:rgba(255,255,255,.06);--l:rgba(255,255,255,.14);--f:#EDEFFA;--m:#8F94B8;--c:#2DE2E6;--r:#FF4D6D;color-scheme:dark;
  --sans:Vazirmatn,system-ui,Tahoma,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--f);font-family:var(--sans);line-height:1.8;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 25%,rgba(45,226,230,.22),transparent 70%),radial-gradient(38% 34% at 80% 70%,rgba(255,77,109,.2),transparent 70%);animation:dr 22s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate3d(6%,-5%,0) scale(1.15)}}
main{max-width:900px;margin:0 auto;padding:22px 14px 70px}
h1{font-size:clamp(34px,9vw,64px);line-height:1.15;margin:26px 0 8px;font-weight:900;letter-spacing:-1px}
h1 b{background:linear-gradient(100deg,var(--c),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--m);margin:0 0 22px;max-width:34em}
.glass,details{background:var(--g);border:1px solid var(--l);border-radius:14px;padding:14px 16px;margin:12px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
summary{cursor:pointer;font-weight:700}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);color:var(--f);border:1px solid var(--l);border-radius:9px;padding:10px;font:inherit}
input[type=checkbox]{width:auto;margin-left:8px}
textarea{min-height:100px;resize:vertical;font-size:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--l);background:var(--g);color:var(--f);border-radius:9px;padding:7px 14px}
button:hover{border-color:var(--c)}
button[aria-pressed=true]{background:var(--f);color:var(--bg);border-color:var(--f)}
.go{width:100%;margin-top:12px;padding:14px;font-weight:900;font-size:17px;color:#04121a;border:0;background:linear-gradient(100deg,var(--c),#7CF0B8 55%,var(--r))}
.go:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{font-size:13px}
#log{font-family:var(--mono);font-size:12.5px;direction:rtl;white-space:pre-wrap;word-break:break-word;color:#9BF6E3;background:rgba(0,0,0,.45);border:1px solid var(--l);border-radius:12px;padding:12px;margin:12px 0;max-height:190px;overflow:auto;min-height:0}
#log:empty{display:none}
#log .e{color:var(--r)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 8px}
.bar .sp{flex:1}
.stage{display:flex;justify-content:center;background:rgba(0,0,0,.35);border:1px solid var(--l);border-radius:14px;padding:12px;overflow:auto}
#fw{width:100%;transition:width .35s ease}
iframe{width:100%;height:72vh;min-height:440px;border:0;border-radius:8px;background:#fff;display:block}
#code{direction:ltr;text-align:left;font-family:var(--mono);font-size:12.5px;min-height:460px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row>input{flex:1;min-width:160px}
a{color:var(--c)}
#gst,.err{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--m)}
.err{color:var(--r)}
#mn{font-size:13px;color:var(--m);margin:8px 0 0}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){body::before{animation:none}#fw{transition:none}}
</style>
</head>
<body>
<main>
<h1>هر سایتی که بخوای،<br><b>با یک جمله.</b></h1>
<p class="sub">بنویس چی می‌خوای. اول طرح می‌کشه، بعد کد می‌نویسه، خودش چکش می‌کنه و آماده‌ی آپلود تحویل می‌ده.</p>

<details id="set"><summary>تنظیمات API</summary>
  <label for="key">API key</label>
  <input id="key" type="password" autocomplete="off" dir="ltr" placeholder="dahl_...">
  <label for="base">Base URL</label>
  <input id="base" dir="ltr" value="https://inference.dahl.global/v1">
  <label for="model">مدل</label>
  <div class="row" style="margin-top:0"><select id="model" dir="ltr" style="flex:1"><option>MiniMaxAI/MiniMax-M2.7</option></select><button id="rf" type="button">بروزرسانی</button></div>
  <p id="mn"></p>
</details>

<div class="glass">
  <label style="margin-top:0">حال‌وهوای طراحی</label>
  <div class="chips" id="dirs"></div>
  <label for="q">چه سایتی می‌خوای؟</label>
  <textarea id="q" placeholder="مثلاً: یه سایت برای ویدیو بساز که ویدیوها رو توی گالری نشون بده و پلیر خفن داشته باشه"></textarea>
  <div class="chips" id="ex"></div>
  <label style="margin:6px 0 0"><input type="checkbox" id="two" checked>طراحی دو مرحله‌ای (اول طرح، بعد کد؛ کیفیت بالاتر، کمی کندتر)</label>
  <button class="go" id="go" type="button">بساز</button>
</div>
<div id="log" role="status" aria-live="polite"></div>

<div class="bar">
  <button id="t1" aria-pressed="true" type="button">پیش‌نمایش</button><button id="t2" aria-pressed="false" type="button">کد</button>
  <span class="sp"></span>
  <button id="d1" type="button" aria-pressed="false">موبایل</button><button id="d2" type="button" aria-pressed="false">تبلت</button><button id="d3" type="button" aria-pressed="true">دسکتاپ</button>
  <button id="fs" type="button">تمام‌صفحه</button>
</div>
<div id="pv"><div class="stage"><div id="fw"><iframe id="fr" sandbox="allow-scripts allow-forms allow-modals" title="پیش‌نمایش سایت"></iframe></div></div>
  <div id="eb" class="glass err" hidden><div id="et"></div><button id="fix" type="button" style="margin-top:8px">رفع خطا با هوش مصنوعی</button></div></div>
<div id="cv" hidden><textarea id="code" readonly aria-label="کد سایت"></textarea>
  <div class="row"><button id="cp" type="button">کپی کد</button><button id="dl" type="button">دانلود index.html</button></div></div>

<div class="glass">
  <label for="ch" style="margin-top:0">تغییر بده</label>
  <div class="row" style="margin-top:0"><input id="ch" placeholder="مثلاً: رنگ‌ها گرم‌تر بشه و یه بخش قیمت‌ها اضافه کن"><button id="chg" type="button">اعمال</button></div>
  <div class="row"><button id="up2" type="button">ارتقای طراحی (نقد و بهتر کردن)</button><button id="undo" type="button">نسخه قبلی</button></div>
</div>

<details><summary>آپلود در گیت‌هاب</summary>
  <label for="tok">GitHub token (دسترسی ساخت repo و نوشتن محتوا)</label>
  <input id="tok" type="password" autocomplete="off" dir="ltr">
  <label for="repo">اسم repo</label>
  <input id="repo" dir="ltr" value="my-ai-site">
  <label><input type="checkbox" id="pages" checked>GitHub Pages هم فعال بشه</label>
  <label><input type="checkbox" id="priv">repo خصوصی باشه (Pages ممکنه کار نکنه)</label>
  <button class="go" id="up" type="button">آپلود</button>
  <div id="gst"></div>
</details>
</main>
<script>
const $=s=>document.querySelector(s);
const L=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const SYS=`You are a world-class front-end designer-engineer. You turn a short request into one finished, memorable website.
OUTPUT: exactly ONE complete \`\`\`html code block (single index.html, inline CSS and JS), then one short summary line in the user's language. Nothing else.
BUDGET: think briefly (a short plan only), then write the file. Keep the whole file under about 600 lines so it is never cut off. Never stop in the middle of the file.
DESIGN (most important):
- Commit fully to the given aesthetic direction. If it is "auto", pick the direction that fits the subject and audience; never fall back to a default look. Words like "modern" or "clean" are not a direction.
- Typography: pair ONE distinctive display font with ONE refined body font, loaded with a Google Fonts <link> and with fallback stacks. Never use Inter, Roboto, Arial or plain system fonts as the main font. For Persian/Arabic use Vazirmatn or Lalezar for display. Use a strong size scale (huge headline, small quiet details).
- Color: define CSS variables. One dominant color plus one sharp accent. No purple-on-white gradients. Build depth with layered backgrounds: gradients, an inline SVG noise or grid pattern, glows.
- Layout: no row of three identical cards with icons. Use asymmetry, big type, overlap, generous spacing, one unforgettable hero (interactive element, live demo, big visual built with CSS/SVG).
- Motion: CSS only for decoration. ONE orchestrated page-load sequence with staggered reveals, plus meaningful hover/focus states. Respect prefers-reduced-motion.
- Copy: real, specific, believable text in the user's language. No lorem ipsum. Realistic names and numbers.
CODE QUALITY (the file is machine-checked, any failure means a rewrite):
- Starts with <!DOCTYPE html>, ends with </html>. No placeholders such as TODO or "..." (the file is deployed as-is).
- Mobile-first, tested mentally at 360px width, viewport meta tag. dir="rtl" lang="fa" for Persian.
- No external images, scripts or libraries (only the Google Fonts link). Use CSS/SVG/emoji for visuals. Videos: use a real <video controls> element and let the user pick a file with <input type=file> and URL.createObjectURL.
- JavaScript: plain ES2017, one <script> at the end of <body>, straight ASCII quotes only, use const/let, every variable and function defined before use, no import/export. Every id used in JavaScript (getElementById, querySelector) must exist in the HTML. Check that null elements are never dereferenced. Interactive parts must really work.
- Close every tag, brace and parenthesis. Re-read the JavaScript once for syntax errors before answering.
- Accessible: semantic HTML, contrast, visible focus, aria-labels.
- Do not add features nobody asked for. If unclear, choose the simplest assumption.`;
const BRIEF=`You are an art director. Given a website request and an aesthetic direction, reply with a SHORT design brief (max 120 words, same language as the request): subject and audience, chosen direction, palette as 4 named hex colors, display font and body font (Google Fonts, not Inter/Roboto/Arial), the hero idea, the list of sections, and the single signature motion. No code. Think very briefly.`;
const DIRS=[['auto','خودکار'],['neon cyber-noir with glowing neon accents and glass panels','سایبر نئون'],['editorial magazine: huge serif type, tight grid, rules and captions','مجله‌ای'],['neo-brutalist: thick borders, flat bold colors, oversized type, hard shadows','برالیست'],['retro-futuristic: CRT glow, mono type, scanlines, amber/teal','رترو فیوچر'],['luxury minimal: lots of whitespace, refined serif, one metallic accent','مینیمال لوکس'],['playful gaming: bold shapes, vivid gradients, sticker-like elements','گیمینگ']];
const EX=[['ویدیو','یه سایت برای ویدیو بساز: گالری ویدیو، پلیر خفن و لیست پخش'],['فیلم','یه صفحه معرفی برای یه فیلم خیالی با طراحی سینمایی بساز'],['شخصی','یه سایت شخصی برای یه برنامه‌نویس با پروژه‌ها و تماس بساز'],['فروشگاه','یه صفحه فروش برای یه محصول خیالی بساز']];
/* قوانین رسمی هر مدل (از صفحه مدل‌ها): دما، top_p و top_k */
const PROFILES=[
  {re:/minimax/i,t:1,p:.95,k:40,note:'MiniMax M2.7: طبق توصیه سازنده دما 1.0، top_p 0.95 و top_k 40. همیشه فکر می‌کنه (<think>) و فکرش از سقف خروجی کم می‌کنه.'},
  {re:/kimi/i,t:1,p:.95,note:'Kimi K2.6: حالت thinking با دمای 1.0 و top_p 0.95. دمای اشتباه کیفیت رو خیلی پایین میاره.'},
  {re:/deepseek/i,t:1,p:1,note:'DeepSeek V4 Flash: دمای 1.0 و top_p 1.0 (0.95 فقط برای عامل‌ها). فکر کردنش پیش‌فرض روشنه.'}
];
const prof=()=>PROFILES.find(x=>x.re.test(sel.value))||{t:1,p:.95,note:'مدل ناشناس: دمای 1.0 و top_p 0.95.'};
let dir=DIRS[0][0],hist=[],vers=[],html='',errs=[],lastCut=false;
const sel=$('#model');
const showNote=()=>{$('#mn').textContent=prof().note};
$('#key').value=L('key')||'';$('#tok').value=L('tok')||'';if(L('base'))$('#base').value=L('base');
const base=()=>$('#base').value.trim().replace(/\/$/,'');
const log=(t,bad,clr)=>{const e=$('#log');if(clr)e.textContent='';if(!t)return;const d=document.createElement('div');if(bad)d.className='e';d.textContent=t;e.appendChild(d);e.scrollTop=e.scrollHeight};
const busy=b=>['go','fix','chg','up2'].forEach(i=>$('#'+i).disabled=b);
['key','tok','base'].forEach(k=>$('#'+k).addEventListener('change',()=>L(k,$('#'+k).value)));
sel.addEventListener('change',()=>{L('model',sel.value);showNote()});
DIRS.forEach(([v,n],i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-pressed',i===0);
  b.onclick=()=>{dir=v;$('#dirs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};$('#dirs').appendChild(b)});
EX.forEach(([n,t])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>{$('#q').value=t};$('#ex').appendChild(b)});
async function models(){
  try{
    const j=await (await fetch(base()+'/models')).json();
    sel.innerHTML='';j.data.forEach(m=>sel.add(new Option(m.id,m.id)));
    const s=L('model'),d=[...sel.options].find(o=>/MiniMax-M2\.7$/.test(o.value));
    if(s&&[...sel.options].some(o=>o.value===s))sel.value=s;else if(d)sel.value=d.value;
  }catch(e){log('لیست مدل‌ها لود نشد؛ مدل پیش‌فرض استفاده می‌شه.',1)}
  showNote();
}
$('#rf').onclick=models;models();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function ask(msgs,max,label){
  const P=prof();let useK=!!P.k,mx=max;lastCut=false;
  for(let t=0;t<6;t++){
    const body={model:sel.value,messages:msgs,stream:true,temperature:P.t,top_p:P.p,max_tokens:mx};
    if(useK)body.top_k=P.k;
    const r=await fetch(base()+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('#key').value.trim()},body:JSON.stringify(body)});
    if(!r.ok){
      const x=await r.text();
      if((r.status===503||r.status===429)&&t<4){log('سرور شلوغه، دوباره تلاش می‌کنم...');await wait(2500*(t+1));continue}
      if(r.status===400||r.status===422){
        if(/max_tokens|context|too (large|long)|exceed/i.test(x)&&mx>4000){mx=Math.floor(mx/2);log('سقف خروجی رو کم کردم: '+mx);continue}
        if(useK){useK=false;log('top_k قبول نشد؛ بدونش ادامه می‌دم.');continue}
      }
      throw new Error(r.status+' - '+(r.status===401?'کلید نامعتبر است':r.status===402?'توکن‌ها تمام شده؛ یه کلید جدید بساز':x.slice(0,200)));
    }
    log(label+' شروع شد...');
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='',th=0,n=0;
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
      for(const l of ls){
        if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
        try{
          const ch=JSON.parse(d).choices[0];if(!ch)continue;
          const dl=ch.delta||{},rs=dl.reasoning_content||dl.reasoning||'';
          if(ch.finish_reason==='length')lastCut=true;
          if(rs)th+=rs.length;
          if(dl.content)out+=dl.content;
          if(++n%25===0)$('#log').lastChild.textContent=label+' فکر: '+th+' | نوشته: '+out.length+' نویسه';
        }catch(e){}
      }
    }
    return out;
  }
  throw new Error('سرور جواب نداد؛ چند دقیقه بعد دوباره امتحان کن.');
}
function extract(t){
  t=t.replace(/<think>[\s\S]*?<\/think>/g,'');
  if(/<think>/.test(t))return '';
  if(/<\/think>/.test(t))t=t.split('</think>').pop();
  const m=t.match(/```html\s*([\s\S]*?)```/i)||t.match(/```html\s*([\s\S]*)$/i);
  return (m?m[1]:(t.match(/<!DOCTYPE[\s\S]*<\/html>/i)||[''])[0]).trim();
}
function check(h){
  const p=[];
  if(!/^<!DOCTYPE html/i.test(h))p.push('must start with <!DOCTYPE html>');
  if(!/<\/html>\s*$/i.test(h))p.push('file is incomplete: it must end with </html>');
  if(h.length<3500)p.push('design is too minimal: make it richer and more polished');
  if(/TODO|lorem ipsum|rest of (the )?code|(\/\/|<!--|\/\*)\s*\.\.\./i.test(h))p.push('remove placeholders (TODO, lorem ipsum, "...")');
  if(!/viewport/i.test(h))p.push('add the viewport meta tag');
  if(!/<body[\s>]/i.test(h))p.push('add a <body> element');
  if((h.match(/<style[\s>]/gi)||[]).length!==(h.match(/<\/style>/gi)||[]).length)p.push('unclosed <style> tag');
  if((h.match(/<script[\s>]/gi)||[]).length!==(h.match(/<\/script>/gi)||[]).length)p.push('unclosed <script> tag');
  if(/(src|href)=["']https?:\/\/(?!fonts\.(googleapis|gstatic)\.com)/i.test(h)&&/src=["']https?:/i.test(h))p.push('no external images or scripts: use inline CSS/SVG only');
  if(/font-family:\s*["']?(Inter|Roboto|Arial|Helvetica)\b/i.test(h))p.push('do not use Inter/Roboto/Arial/Helvetica as the main font: choose distinctive Google Fonts');
  if(/@keyframes|animation:/.test(h)&&!/prefers-reduced-motion/.test(h))p.push('add a prefers-reduced-motion rule for animations');
  /* بررسی واقعی نحو جاوااسکریپت (بدون اجرا) */
  const re=/<script([^>]*)>([\s\S]*?)<\/script>/gi;let m,js='';
  while((m=re.exec(h))){
    if(/\bsrc\s*=/.test(m[1])||/type\s*=\s*["']?(?!text\/javascript|application\/javascript)/i.test(m[1]))continue;
    js+=m[2]+'\n';
    try{new Function(m[2])}catch(e){p.push('JavaScript syntax error: '+e.message)}
  }
  /* idهایی که جاوااسکریپت صدا می‌زنه ولی تو HTML نیست */
  const ids=new Set([...h.matchAll(/\bid\s*=\s*["']([^"']+)["']/g)].map(x=>x[1]));
  [...js.matchAll(/\.id\s*=\s*["']([^"']+)["']/g)].forEach(x=>ids.add(x[1]));
  [...js.matchAll(/setAttribute\(\s*["']id["']\s*,\s*["']([^"']+)["']/g)].forEach(x=>ids.add(x[1]));
  const used=[...js.matchAll(/getElementById\(\s*["']([^"']+)["']\s*\)/g)].map(x=>x[1]).concat([...js.matchAll(/querySelector\(\s*["']#([\w-]+)["']\s*\)/g)].map(x=>x[1]));
  const miss=[...new Set(used.filter(x=>!ids.has(x)))].slice(0,5);
  if(miss.length)p.push('JavaScript uses ids that do not exist in the HTML: '+miss.join(', '));
  return p;
}
const HOOK='<script>addEventListener("error",function(e){parent.postMessage({err:e.message+" (line "+e.lineno+")"},"*")});addEventListener("unhandledrejection",function(e){parent.postMessage({err:"Promise: "+(e.reason&&e.reason.message||e.reason)},"*")})<\/script>';
const withHook=h=>/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+HOOK):HOOK+h;
/* تست اجرا: سایت رو توی یه iframe نامرئی باز می‌کنه و خطاهای زمان اجرا رو جمع می‌کنه */
function probe(h){
  return new Promise(res=>{
    const f=document.createElement('iframe'),found=[];
    f.setAttribute('sandbox','allow-scripts');f.setAttribute('aria-hidden','true');f.tabIndex=-1;
    f.style.cssText='position:fixed;left:-9999px;top:0;width:360px;height:640px;min-height:0;border:0';
    const on=e=>{if(e.source===f.contentWindow&&e.data&&e.data.err)found.push('JavaScript runtime error: '+e.data.err)};
    addEventListener('message',on);
    f.srcdoc=withHook(h);document.body.appendChild(f);
    setTimeout(()=>{removeEventListener('message',on);f.remove();res([...new Set(found)].slice(0,3))},2200);
  });
}
function show(h,keep){
  html=h;errs=[];$('#eb').hidden=true;$('#code').value=h;if(!keep)vers.push(h);
  $('#fr').srcdoc=withHook(h);
}
addEventListener('message',e=>{
  if(e.source!==$('#fr').contentWindow||!e.data||!e.data.err)return;
  errs.push(e.data.err);$('#et').textContent='خطای جاوااسکریپت در سایت: '+errs.slice(0,3).join(' | ');$('#eb').hidden=false;
});
async function gen(text,fresh){
  busy(true);log('',0,1);
  try{
    let u=text;
    if(fresh){
      hist=[];const dd=dir==='auto'?'auto (choose what fits the subject)':dir;
      u='Request: '+text+'\nAesthetic direction: '+dd;
      if($('#two').checked){
        log('۱) دارم طرح طراحی می‌کشم...');
        const b=await ask([{role:'system',content:BRIEF},{role:'user',content:u}],6000,'۱) طرح:');
        const bb=b.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/^[\s\S]*<\/think>/,'').trim();
        if(bb&&!/<think>/.test(bb)){u+='\n\nDesign brief (follow it):\n'+bb;log('طرح آماده شد:\n'+bb.slice(0,420))}
      }
    }
    hist.push({role:'user',content:u});
    let msgs=[{role:'system',content:SYS},...hist.slice(-6)];
    for(let i=0;i<3;i++){
      log('۲) دارم کد می‌نویسم...');
      const raw=await ask(msgs,32000,'۲) کد:'),h=extract(raw);
      let p=h?check(h):['reply with one complete ```html block'];
      if(!p.length){log('۳) دارم سایت رو تستِ اجرا می‌کنم...');p=await probe(h)}
      if(!p.length){hist.push({role:'assistant',content:'```html\n'+h+'\n```'});show(h);log('✓ همه چک‌ها (نحو، ساختار، اجرا) قبول شد. آماده‌ست.');return}
      if(i<2){
        log('ایراد پیدا شد، اصلاح می‌کنم ('+(i+1)+'/2): '+p.join('، '),1);
        const last=msgs[msgs.length-1];
        if(lastCut||!h)msgs=[...msgs.slice(0,-1),{role:'user',content:last.content+'\n\nYour previous answer was cut off or invalid ('+p.join('; ')+'). Write a more compact but complete version: under 500 lines, fewer sections, shorter CSS. Return the full file in one ```html block.'}];
        else msgs=[...msgs,{role:'assistant',content:'```html\n'+h+'\n```'},{role:'user',content:'Problems found: '+p.join('; ')+'. Fix them and return the full corrected file in one ```html block.'}];
      }else{if(h)show(h);log('بعد از ۲ بار اصلاح این ایرادها مونده: '+p.join('، ')+'. درخواست رو دقیق‌تر بنویس یا «ارتقای طراحی» بزن.',1)}
    }
  }catch(e){log('خطا: '+(e.name==='TypeError'?'اتصال برقرار نشد (اینترنت، VPN یا محدودیت CORS سرور).':e.message),1);hist.pop()}
  finally{busy(false)}
}
const need=()=>{if(!$('#key').value.trim()){$('#set').open=true;log('API key رو توی تنظیمات وارد کن.',1,1);return false}L('model',sel.value);return true};
$('#go').onclick=()=>{const q=$('#q').value.trim();if(!q)return log('اول بنویس چه سایتی می‌خوای.',1,1);if(need())gen(q,true)};
$('#chg').onclick=()=>{const q=$('#ch').value.trim();if(!html)return log('اول یه سایت بساز.',1,1);if(!q)return;if(need()){gen('Change the current site as follows and return the FULL updated file in one ```html block: '+q,false);$('#ch').value=''}};
$('#up2').onclick=()=>{if(!html)return log('اول یه سایت بساز.',1,1);if(need())gen('Critique the current design like a ruthless art director (typography hierarchy, color, hero impact, spacing rhythm, motion, generic-looking parts), then fix everything you found. Keep the content and features. Return the FULL updated file in one ```html block.',false)};
$('#fix').onclick=()=>gen('The page has JavaScript errors: '+errs.slice(0,3).join(' | ')+'. Fix them and return the full file in one ```html block.',false);
$('#undo').onclick=()=>{if(vers.length<2)return log('نسخه قبلی وجود نداره.',1,1);vers.pop();show(vers[vers.length-1],true);log('به نسخه قبلی برگشتی.',0,1)};
const tab=n=>{$('#pv').hidden=n!==1;$('#cv').hidden=n!==2;$('#t1').setAttribute('aria-pressed',n===1);$('#t2').setAttribute('aria-pressed',n===2)};

[['d1','390px'],['d2','768px'],['d3','100%']].forEach(([i,w])=>$('#'+i).onclick=()=>{$('#fw').style.width=w;['d1','d2','d3'].forEach(x=>$('#'+x).setAttribute('aria-pressed',x===i))});
$('#fs').onclick=()=>{if(html)window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank')};
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(html);$('#cp').textContent='کپی شد'}catch(e){$('#code').select();$('#cp').textContent='انتخاب شد، کپی کن'}};
$('#dl').onclick=()=>{if(!html)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click()};
function gst(t){
  const e=$('#gst');e.textContent='';
  t.split(/(https?:\/\/\S+)/).forEach(s=>{if(/^https?:/.test(s)){const a=document.createElement('a');a.href=s;a.textContent=s;a.target='_blank';a.rel='noopener';e.appendChild(a)}else e.append(s)});
}
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+$('#tok').value.trim(),Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  let j={};try{j=await r.json()}catch(e){}return {r,j};
}
$('#up').onclick=async()=>{
  if(!html)return gst('اول یه سایت بساز.');
  const name=$('#repo').value.trim().replace(/[^\w.-]/g,'-');
  if(!name||!$('#tok').value.trim())return gst('اسم repo و توکن گیت‌هاب لازمه.');
  L('tok',$('#tok').value);$('#up').disabled=true;
  try{
    let {r,j}=await gh('/user');if(!r.ok)return gst('توکن گیت‌هاب نامعتبره.');
    const me=j.login;
    ({r,j}=await gh('/user/repos',{method:'POST',body:JSON.stringify({name,auto_init:true,private:$('#priv').checked})}));
    if(r.status===422){if(!confirm('repo با این اسم از قبل هست. فایل index.html داخلش جایگزین بشه؟'))return gst('لغو شد.')}
    else if(!r.ok)return gst('ساخت repo ناموفق بود: '+(j.message||r.status));
    ({r,j}=await gh(`/repos/${me}/${name}/contents/index.html`));const sha=r.ok?j.sha:undefined;
    ({r,j}=await gh(`/repos/${me}/${name}/contents/index.html`,{method:'PUT',body:JSON.stringify({message:'Add site',content:btoa(unescape(encodeURIComponent(html))),sha})}));
    if(!r.ok)return gst('آپلود ناموفق بود: '+(j.message||r.status));
    let msg='آپلود شد: https://github.com/'+me+'/'+name;
    if($('#pages').checked){
      const p=await gh(`/repos/${me}/${name}/pages`,{method:'POST',body:JSON.stringify({source:{branch:'main',path:'/'}})});
      msg+=(p.r.ok||p.r.status===409)?'\nسایت زنده (چند دقیقه صبر کن): https://'+me+'.github.io/'+name+'/':'\nفعال‌سازی Pages ناموفق بود: '+(p.j.message||p.r.status);
    }
    gst(msg);
  }catch(e){gst('خطا: '+e.message)}
  finally{$('#up').disabled=false}
};
